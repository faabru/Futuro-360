# Futuro 360 - Blueprint de Render (un único servicio web Flask).
#
# Emails (core/mailer.py): PIN de recuperacion y aviso de cuenta eliminada
# van por la API v3 de Brevo; el formulario de contacto/soporte usa Resend.
# Ambos por HTTPS porque Render bloquea el SMTP saliente.
#
# En el dashboard de Render hay que definir ademas (secrets, sync: false):
#   SECRET_KEY, DB_* (Aiven), RESEND_API_KEY, MAIL_FROM, ADMIN_PASSWORD,
#   BREVO_API_KEY, SENDER_EMAIL, y las de Cloudinary si se usan.
services:
  - type: web
    name: futuro360
    runtime: python
    buildCommand: apt-get update && apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 libffi-dev shared-mime-info && pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --bind 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /login
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.0
      - key: SECRET_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL_CA_CONTENT
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: SENDER_EMAIL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false