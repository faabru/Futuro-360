{% extends 'base.html' %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">

<div class="container admin-login">
    <div class="row justify-content-center align-items-center" style="min-height: 80vh;">
        <div class="col-md-5 col-lg-4">
            <div class="admin-card p-4 p-md-5 admin-login-card" style="box-shadow: 0 12px 32px -12px rgba(16,24,40,0.18);">

                <!-- ENCABEZADO -->
                <div class="text-center mb-4">
                    <div class="mx-auto mb-3 d-inline-flex align-items-center justify-content-center"
                         style="width:64px;height:64px;border-radius:16px;background:rgba(220,53,69,0.1);">
                        <i class="bi bi-key fs-2 text-danger"></i>
                    </div>
                    <h2 class="fw-800 text-center mb-1">Nueva contraseña</h2>
                    <p class="text-center text-muted small fw-bold mb-0">
                        Creá una contraseña segura de al menos 8 caracteres.
                    </p>
                </div>

                <!-- FORMULARIO (POST) -->
                <form action="{{ url_for('admin_auth.admin_nueva_password') }}" method="POST">

                    <div class="mb-3">
                        <label class="form-label small fw-800 text-uppercase text-muted">Nueva contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0">
                                <i class="bi bi-lock text-muted"></i>
                            </span>
                            <input type="password" name="password_nueva" id="password_nueva"
                                   class="form-control bg-light border-start-0 ps-0"
                                   placeholder="••••••••" required minlength="8" autocomplete="new-password">
                            <button class="btn btn-outline-secondary border-start-0" type="button" onclick="togglePassword('password_nueva')">
                                <i class="bi bi-eye" id="toggle_password_nueva"></i>
                            </button>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-800 text-uppercase text-muted">Confirmar contraseña</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0">
                                <i class="bi bi-lock-check text-muted"></i>
                            </span>
                            <input type="password" name="password_confirmar" id="password_confirmar"
                                   class="form-control bg-light border-start-0 ps-0"
                                   placeholder="••••••••" required autocomplete="new-password">
                            <button class="btn btn-outline-secondary border-start-0" type="button" onclick="togglePassword('password_confirmar')">
                                <i class="bi bi-eye" id="toggle_password_confirmar"></i>
                            </button>
                        </div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="admin-btn-primary btn-lg w-100">
                            <i class="bi bi-shield-lock me-1"></i> Cambiar Contraseña
                        </button>
                    </div>

                </form>

            </div>
        </div>
    </div>
</div>

<script>
function togglePassword(inputId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById('toggle_' + inputId);
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('bi-eye', 'bi-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.replace('bi-eye-slash', 'bi-eye');
    }
}
</script>
{% endblock %}
