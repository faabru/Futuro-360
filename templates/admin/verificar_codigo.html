{% extends 'base.html' %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">

<div class="container admin-login">
    <div class="row justify-content-center align-items-center" style="min-height: 80vh;">
        <div class="col-md-5 col-lg-4">
            <div class="admin-card p-4 p-md-5 admin-login-card" style="box-shadow: 0 12px 32px -12px rgba(16,24,40,0.18);">

                <!-- ENCABEZADO -->
                <div class="text-center mb-4">
                    <div class="mx-auto mb-3 d-inline-flex align-items-center justify-content-center"
                         style="width:64px;height:64px;border-radius:16px;background:rgba(220,53,69,0.1);">
                        <i class="bi bi-shield-check fs-2 text-danger"></i>
                    </div>
                    <h2 class="fw-800 text-center mb-1">Verificá tu identidad</h2>
                    <p class="text-center text-muted small fw-bold mb-0">
                        Ingresá el código de 6 dígitos que enviamos a
                        <span class="text-danger">{{ email }}</span>
                    </p>
                </div>

                <!-- FORMULARIO DE CÓDIGO (POST) -->
                <form action="{{ url_for('admin_auth.admin_verificar_codigo') }}" method="POST">
                    <div class="d-flex justify-content-between mb-4 gap-2">
                        {% for i in range(1, 7) %}
                        <input type="text" name="d{{ i }}" class="form-control form-control-lg text-center fw-bold fs-2 digit-input"
                               maxlength="1" pattern="\d" inputmode="numeric" required
                               style="width: 50px; height: 60px;">
                        {% endfor %}
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="admin-btn-primary btn-lg w-100">
                            <i class="bi bi-check2-circle me-1"></i> Verificar Código
                        </button>
                    </div>
                </form>

                <!-- Reenviar código -->
                <div class="text-center mt-4 pt-3 border-top">
                    <p class="mb-1 text-muted">¿No recibiste el código?</p>
                    <a href="{{ url_for('admin_auth.admin_recuperar_password') }}" class="text-danger fw-800 text-decoration-none">
                        Solicitar nuevo código
                    </a>
                </div>

                <p class="text-center mt-3 text-muted small mb-0">
                    <a href="{{ url_for('admin_auth.admin_login') }}" class="text-muted fw-800 text-decoration-none">
                        <i class="bi bi-arrow-left me-1"></i> Volver al inicio de sesión
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>

<script>
document.querySelectorAll('.digit-input').forEach((input, index, inputs) => {
    input.addEventListener('input', (e) => {
        if (e.target.value && index < inputs.length - 1) {
            inputs[index + 1].focus();
        }
    });

    input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && index > 0) {
            inputs[index - 1].focus();
        }
    });

    input.addEventListener('paste', (e) => {
        const pasteData = e.clipboardData.getData('text').trim();
        if (pasteData.length === 6 && /^\d+$/.test(pasteData)) {
            inputs.forEach((inp, i) => {
                inp.value = pasteData[i];
            });
            inputs[5].focus();
            e.preventDefault();
        }
    });
});
</script>
{% endblock %}
