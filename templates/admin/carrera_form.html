{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card border-0 shadow-sm animate__animated animate__fadeInUp">
                <div class="card-header bg-white py-4 border-0">
                    <h2 class="fw-bold mb-0 text-center">
                        {% if carrera %}Editar Carrera{% else %}Nueva Carrera{% endif %}
                    </h2>
                </div>
                <div class="card-body p-4">
                    <form method="POST">
                        <div class="mb-4">
                            <label for="nombre" class="form-label fw-bold">Nombre de la Carrera</label>
                            <input type="text" name="nombre" id="nombre" class="form-control" value="{{ carrera.nombre if carrera else '' }}" required placeholder="Ej: Ingeniería Informática">
                        </div>
                        
                        <div class="mb-4">
                            <label for="area_profesional" class="form-label fw-bold">Área Profesional</label>
                            <input type="text" name="area_profesional" id="area_profesional" class="form-control" value="{{ carrera.area_profesional if carrera else '' }}" required placeholder="Ej: Tecnología">
                        </div>

                        <div class="mb-4">
                            <label for="descripcion" class="form-label fw-bold">Descripción Corta</label>
                            <textarea name="descripcion" id="descripcion" class="form-control" rows="3" required placeholder="Describe brevemente la carrera...">{{ carrera.descripcion if carrera else '' }}</textarea>
                        </div>
                        
                        <div class="mb-4">
                            <label for="a_que_se_dedica" class="form-label fw-bold">¿A qué se dedica? (Detalle largo)</label>
                            <textarea name="a_que_se_dedica" id="a_que_se_dedica" class="form-control" rows="5" placeholder="Los graduados en esta carrera se encargan de...">{{ carrera.a_que_se_dedica if carrera else '' }}</textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-4">
                                <label for="imagen_portada" class="form-label fw-bold">Imagen de Portada (URL)</label>
                                <input type="url" name="imagen_portada" id="imagen_portada" class="form-control" value="{{ carrera.imagen_portada if carrera else '' }}" placeholder="https://ejemplo.com/imagen.jpg">
                                <small class="text-muted">Se mostrará en la grilla de carreras.</small>
                            </div>
                            
                            <div class="col-md-6 mb-4">
                                <label for="imagen_principal" class="form-label fw-bold">Imagen Principal (URL)</label>
                                <input type="url" name="imagen_principal" id="imagen_principal" class="form-control" value="{{ carrera.imagen_principal if carrera else '' }}" placeholder="https://ejemplo.com/imagen.jpg">
                                <small class="text-muted">Se mostrará grande en el detalle de la carrera.</small>
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-save me-1"></i> Guardar Cambios
                            </button>
                            <a href="{{ url_for('admin_carreras') }}" class="btn btn-outline-secondary px-4">
                                Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
