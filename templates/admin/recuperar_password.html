{% extends 'base.html' %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">

<div class="container admin-login">
    <div class="row justify-content-center align-items-center" style="min-height: 80vh;">
        <div class="col-md-5 col-lg-4">
            <div class="admin-card p-4 p-md-5 admin-login-card" style="box-shadow: 0 12px 32px -12px rgba(16,24,40,0.18);">

                <!-- ENCABEZADO -->
                <div class="text-center mb-4">
                    <div class="mx-auto mb-3 d-inline-flex align-items-center justify-content-center"
                         style="width:64px;height:64px;border-radius:16px;background:rgba(220,53,69,0.1);">
                        <i class="bi bi-shield-lock fs-2 text-danger"></i>
                    </div>
                    <h2 class="fw-800 text-center mb-1">¿Olvidaste tu contraseña?</h2>
                    <p class="text-center text-muted small fw-bold mb-0">
                        Ingresá tu correo de administración y te enviaremos un código de verificación.
                    </p>
                </div>

                <!-- FORMULARIO (POST) -->
                <form action="{{ url_for('admin_recuperar_password') }}" method="POST">
                    <div class="mb-3">
                        <label for="email" class="form-label small fw-800 text-uppercase text-muted">Correo Electrónico</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0">
                                <i class="bi bi-envelope text-muted"></i>
                            </span>
                            <input type="email" name="email" id="email"
                                   class="form-control bg-light border-start-0 ps-0"
                                   placeholder="admin@correo.com" required autocomplete="email">
                        </div>
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="admin-btn-primary btn-lg w-100">
                            <i class="bi bi-envelope-paper me-1"></i> Enviar Código
                        </button>
                    </div>
                </form>

                <p class="text-center mt-4 text-muted small mb-0">
                    <a href="{{ url_for('admin_login') }}" class="text-muted fw-800 text-decoration-none">
                        <i class="bi bi-arrow-left me-1"></i> Volver al inicio de sesión
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
