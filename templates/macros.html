{#
  macros.html — Macros reutilizables del sitio.
  Uso en cada template: {% from 'macros.html' import boton_volver %}
#}

{% macro boton_volver(enlace, etiqueta='Volver', clases='') %}
<a href="{{ enlace }}"
   class="btn btn-outline-secondary rounded-pill px-3 shadow-sm d-inline-flex align-items-center gap-1 {{ clases }}">
    <i class="bi bi-arrow-left"></i> {{ etiqueta }}
</a>
{% endmacro %}
