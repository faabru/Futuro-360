{% extends 'base.html' %}

{% block content %}
<!-- SECCIÓN PRINCIPAL: INICIO DE SESIÓN -->
<div class="row justify-content-center align-items-center min-vh-75 py-5">
    <div class="col-md-5">
        <div class="auth-card animate__animated animate__fadeIn">
            
            <!-- ENCABEZADO DE BIENVENIDA -->
            <h2 class="fw-800 text-center mb-2">BIENVENIDO</h2>
            <p class="text-center text-muted mb-5 small fw-bold">INGRESA TUS CREDENCIALES</p>
            
            <!-- FORMULARIO DE ACCESO (POST) -->
            <form action="{{ url_for('auth.login') }}" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <!-- CAMPO: CORREO ELECTRÓNICO -->
                <div class="mb-4">
                    <label for="email" class="form-label small fw-800 text-uppercase text-muted">Correo Electrónico</label>
                    <input type="email" class="form-control" id="email" name="email" required placeholder="tu@email.com">
                </div>
                
                <!-- CAMPO: CONTRASEÑA -->
                <div class="mb-4">
                    <label for="password" class="form-label small fw-800 text-uppercase text-muted">Contraseña</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="password" name="password" required placeholder="********" autocomplete="current-password">
                        <button type="button" class="btn btn-outline-secondary" id="togglePassword" tabindex="-1" aria-label="Mostrar u ocultar contraseña">
                            <i class="bi bi-eye" id="togglePasswordIcon"></i>
                        </button>
                    </div>
                    <a href="{{ url_for('auth.recuperar_password') }}" class="small text-decoration-none d-block mt-2">¿Olvidaste tu contraseña?</a>
                </div>
                
                <!-- BOTÓN DE ACCIÓN: INGRESAR -->
                <div class="d-grid mt-5">
                    <button type="submit" class="btn btn-primary btn-lg rounded-0 fw-800">INGRESAR</button>
                </div>
            </form>
            
            <!-- ENLACE A REGISTRO -->
            <p class="text-center mt-4 text-muted small">¿No tienes cuenta? <a href="{{ url_for('auth.registro') }}" class="text-primary fw-800 text-decoration-none">REGÍSTRATE</a></p>
        </div>
    </div>
</div>
<!--- Mostrar/ocultar la contraseña -->
<script>
document.getElementById('togglePassword')?.addEventListener('click', function () {
    const input = document.getElementById('password');
    const icon = document.getElementById('togglePasswordIcon');
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('bi-eye', 'bi-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.replace('bi-eye-slash', 'bi-eye');
    }
});
</script>

{% endblock %}
